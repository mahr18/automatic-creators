<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAHER CONTENT BRAIN</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#11151c;--panel2:#171c24;--line:#28313d;--text:#f4f7fb;--muted:#9aa6b4;--accent:#ff2b3d;--gold:#ffd24a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171c27 0,#07090d 44%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(920px,100%);margin:auto;padding:22px 15px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-weight:950;letter-spacing:.06em;font-size:18px}.badge{font-size:11px;color:var(--gold);border:1px solid #4a3d18;padding:6px 9px;border-radius:999px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 18px 50px #0005}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:14px;background:#0b0e13;color:var(--text);padding:14px;font:inherit;line-height:1.55;outline:none}
textarea{min-height:160px;resize:vertical}input[type=text]{margin-top:10px}
textarea:focus,input[type=text]:focus{border-color:#566474}.row{display:grid;grid-template-columns:1fr 150px 110px;gap:9px;margin-top:11px}
select,input[type=file],button{width:100%;border:1px solid var(--line);background:#0c1016;color:var(--text);border-radius:12px;padding:11px;font:inherit}
button{background:var(--accent);border-color:transparent;font-weight:850;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
.file{margin-top:10px}.status{color:var(--muted);min-height:23px;margin:12px 2px 4px}.stages{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.stage{font-size:11px;padding:5px 8px;border-radius:999px;background:#0b0e13;border:1px solid var(--line);color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;line-height:1.6;font:inherit;margin:0}.tip{color:var(--muted);font-size:12px;margin-top:10px}
video{width:100%;margin-top:14px;border-radius:16px;background:#000;display:none}
.small{font-size:11px;color:var(--muted);margin-top:6px}
@media(max-width:650px){.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<div class="top"><div class="brand">MAHER CONTENT BRAIN</div><div class="badge">MVP • PHONE FIRST</div></div>

<section class="card">
<input id="token" type="text" placeholder="ضع BRAIN_ACCESS_TOKEN هنا — يُحفظ على هذا الجهاز فقط">
<div class="small">لا تضع OPENAI_API_KEY هنا. هذا الحقل فقط لمفتاح دخول موقعك.</div>
<textarea id="message" placeholder="مثال: أريد فيديو عن ماذا يحدث للطماطم من البذرة إلى الحصاد، 60 ثانية، بدون تعليق صوتي... أو اكتب: ما عندي فكرة"></textarea>
<input id="image" class="file" type="file" accept="image/*">
<div class="row">
<select id="mode">
<option value="auto">AUTO — خلّ العقل يقرر</option>
<option value="idea">IDEA — ابحث لي عن فكرة</option>
<option value="build">BUILD — ابنِ فكرتي</option>
<option value="explore">EXPLORE — استكشف النيش</option>
</select>
<button id="run">RUN BRAIN</button>
<button id="health" style="background:#1b222c">STATUS</button>
</div>
<div class="row" style="grid-template-columns:1fr 1fr;max-width:320px">
<button id="render" style="display:none">🎥 ولّد أول لقطة</button>
<button id="saveToken" style="background:#1b222c">حفظ المفتاح</button>
</div>
<div id="status" class="status"></div>
<div class="tip">الصورة المرجعية اختيارية. العقل لا يضع مفاتيح API داخل المتصفح؛ المفتاح السري OpenAI يبقى على الخادم.</div>
</section>

<section class="card" style="margin-top:14px">
<div id="stages" class="stages"></div>
<pre id="output">جاهز.</pre>
<video id="video" controls playsinline></video>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
$("token").value=localStorage.getItem("maher_brain_token")||"";
$("saveToken").onclick=()=>{localStorage.setItem("maher_brain_token",$("token").value.trim());$("status").textContent="تم حفظ مفتاح الدخول على هذا الجهاز.";};

const readDataUrl=file=>new Promise((resolve,reject)=>{
 if(!file){resolve(null);return}
 const img=new Image();
 const r=new FileReader();
 r.onload=()=>{img.onload=()=>{
   const max=1600, scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
   const canvas=document.createElement("canvas");
   canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
   canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=canvas.getContext("2d");
   ctx.drawImage(img,0,0,canvas.width,canvas.height);
   canvas.toBlob(blob=>{
     if(!blob){reject(new Error("تعذر ضغط الصورة."));return}
     const rr=new FileReader();
     rr.onload=()=>resolve(rr.result);
     rr.onerror=reject;
     rr.readAsDataURL(blob);
   },"image/jpeg",.82);
 };img.onerror=()=>reject(new Error("تعذر قراءة الصورة."));img.src=r.result};
 r.onerror=reject;r.readAsDataURL(file)
});
const auth=()=>({Authorization:"Bearer "+$("token").value.trim()});

let latestPack=null;

$("run").onclick=async()=>{
 if(!$("message").value.trim())return;
 $("run").disabled=true;$("render").style.display="none";$("video").style.display="none";
 $("status").textContent="العقل يعمل: بحث → استراتيجية → برومبت → فحص → إصلاح";
 $("output").textContent="";$("stages").innerHTML="";
 try{
  const img=await readDataUrl($("image").files[0]);
  const res=await fetch("/api/brain",{method:"POST",headers:{"Content-Type":"application/json",...auth()},body:JSON.stringify({
   message:$("message").value,mode:$("mode").value,reference_image_data_url:img,save_to_memory:true
  })});
  const data=await res.json();
  if(!res.ok)throw new Error(data.detail||"Request failed");
  latestPack=data.production_pack||null;
  $("output").textContent=data.output;
  $("stages").innerHTML=(data.stages||[]).map(x=>'<span class="stage">✓ '+x+"</span>").join("");
  if(latestPack?.shots?.length) $("render").style.display="block";
  $("status").textContent=data.memory_saved?"تم الحفظ في ذاكرة المشروع.":"اكتمل التنفيذ.";
 }catch(e){$("status").textContent="خطأ: "+e.message}
 finally{$("run").disabled=false}
};

$("render").onclick=async()=>{
 if(!latestPack?.shots?.[0])return;
 $("render").disabled=true;$("video").style.display="none";
 $("status").textContent="جارٍ توليد أول لقطة عبر Veo 3.1… قد يستغرق الأمر بعض الوقت.";
 try{
  const s=latestPack.shots[0];
  const res=await fetch("/api/video",{method:"POST",headers:{"Content-Type":"application/json",...auth()},body:JSON.stringify({
   prompt:s.prompt,aspect_ratio:latestPack.aspect_ratio||"16:9"
  })});
  const data=await res.json();
  if(!res.ok)throw new Error(data.detail||"Video generation failed");
  if(!data.file_name)throw new Error("تم التوليد لكن لم يُرجع ملفًا قابلًا للعرض.");
  const media=await fetch("/api/media/"+encodeURIComponent(data.file_name),{headers:auth()});
  if(!media.ok)throw new Error("تعذر جلب ملف الفيديو.");
  const blob=await media.blob();
  $("video").src=URL.createObjectURL(blob);
  $("video").style.display="block";
  $("status").textContent="تم توليد اللقطة ويمكن مشاهدتها من الهاتف.";
 }catch(e){$("status").textContent="خطأ: "+e.message}
 finally{$("render").disabled=false}
};

$("health").onclick=async()=>{
 try{
  const data=await (await fetch("/api/health")).json();
  const m=data.models||{};
  $("status").textContent="API: "+(data.ok?"✓":"✗")+" | Auth: "+(data.auth_configured?"✓":"✗")+" | OpenAI: "+(data.openai_configured?"✓":"✗")+" | YouTube: "+(data.youtube_configured?"✓":"—")+" | Veo: "+(data.veo_configured?"✓":"—")+" | Strategy: "+(m.strategy||"—");
 }catch(e){$("status").textContent="تعذر فحص الحالة."}
};
</script>
</body>
</html>
