<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAHER CONTENT BRAIN</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#11151c;--panel2:#171c24;--line:#28313d;--text:#f4f7fb;--muted:#9aa6b4;--accent:#ff2b3d;--gold:#ffd24a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171c27 0,#07090d 44%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(920px,100%);margin:auto;padding:22px 15px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-weight:950;letter-spacing:.06em;font-size:18px}.badge{font-size:11px;color:var(--gold);border:1px solid #4a3d18;padding:6px 9px;border-radius:999px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 18px 50px #0005}
textarea{width:100%;min-height:160px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:#0b0e13;color:var(--text);padding:14px;font:inherit;line-height:1.55;outline:none}
textarea:focus{border-color:#566474}.row{display:grid;grid-template-columns:1fr 150px 110px;gap:9px;margin-top:11px}
select,input[type=file],button{width:100%;border:1px solid var(--line);background:#0c1016;color:var(--text);border-radius:12px;padding:11px;font:inherit}
button{background:var(--accent);border-color:transparent;font-weight:850;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
.file{margin-top:10px}.status{color:var(--muted);min-height:23px;margin:12px 2px 4px}.stages{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.stage{font-size:11px;padding:5px 8px;border-radius:999px;background:#0b0e13;border:1px solid var(--line);color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;line-height:1.6;font:inherit;margin:0}
.tip{color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:650px){.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<div class="top"><div class="brand">MAHER CONTENT BRAIN</div><div class="badge">MVP • PHONE FIRST</div></div>
<section class="card">
<textarea id="message" placeholder="مثال: أريد فيديو عن ماذا يحدث للطماطم من البذرة إلى الحصاد، 60 ثانية، بدون تعليق صوتي... أو اكتب: ما عندي فكرة"></textarea>
<input id="image" class="file" type="file" accept="image/*">
<div class="row">
<select id="mode">
<option value="auto">AUTO — خلّ العقل يقرر</option>
<option value="idea">IDEA — ابحث لي عن فكرة</option>
<option value="build">BUILD — ابنِ فكرتي</option>
<option value="explore">EXPLORE — استكشف النيش</option>
</select>
<button id="run">RUN BRAIN</button>
<button id="health" style="background:#1b222c">STATUS</button>
</div>
<div id="status" class="status"></div>
<div class="tip">الصورة المرجعية اختيارية. لا تضع مفاتيح API داخل هذه الصفحة.</div>
</section>
<section class="card" style="margin-top:14px"><div id="stages" class="stages"></div><pre id="output">جاهز.</pre></section>
</main>
<script>
const $=id=>document.getElementById(id);
const readDataUrl=file=>new Promise((resolve,reject)=>{
 if(!file){resolve(null);return}
 const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)
});
$("run").onclick=async()=>{
 if(!$("message").value.trim())return;
 $("run").disabled=true;
 $("status").textContent="العقل يعمل: بحث → استراتيجية → برومبت → فحص → إصلاح";
 $("output").textContent="";$("stages").innerHTML="";
 try{
  const img=await readDataUrl($("image").files[0]);
  const res=await fetch("/api/brain",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   message:$("message").value,mode:$("mode").value,reference_image_data_url:img,save_to_memory:true
  })});
  const data=await res.json();
  if(!res.ok)throw new Error(data.detail||"Request failed");
  $("output").textContent=data.output;
  $("stages").innerHTML=(data.stages||[]).map(x=>'<span class="stage">✓ '+x+"</span>").join("");
  $("status").textContent=data.memory_saved?"تم الحفظ في ذاكرة المشروع.":"اكتمل التنفيذ.";
 }catch(e){$("status").textContent="خطأ: "+e.message}
 finally{$("run").disabled=false}
};
$("health").onclick=async()=>{
 try{
  const data=await (await fetch("/api/health")).json();
  $("status").textContent="OpenAI: "+(data.openai_configured?"✓":"✗")+" | YouTube: "+(data.youtube_configured?"✓":"—")+" | Veo: "+(data.veo_configured?"✓":"—");
 }catch(e){$("status").textContent="تعذر فحص الحالة."}
};
</script>
</body>
</html>
