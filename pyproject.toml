[project]
name = "maher-content-brain"
version = "0.1.0"
description = "A mobile-first agentic content brain for the What If / Transformation / Timelapse niche."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "openai>=1.100,<3",
  "openai-agents>=0.14,<0.15",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
video = ["google-genai>=1,<3"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
